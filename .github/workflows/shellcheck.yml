# Checks every shell script with ShellCheck. This repository is public, so GitHub-hosted runners cost nothing.
name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (preinstalled on GitHub's Ubuntu runners)
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck
