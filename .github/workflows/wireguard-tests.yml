# Verify WireGuard config, peer operations, firewall fail-closed checks and syntax.
name: WireGuard tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WireGuard overlay regression tests
        run: bash network/tests/wireguard-test.sh
